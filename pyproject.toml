[project]
name = "assistant_for_chloe"
version = "0.1.0"
description = "assistant_for_chloe using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
assistant_for_chloe = "assistant_for_chloe.main:run"
run_crew = "assistant_for_chloe.main:run"
train = "assistant_for_chloe.main:train"
replay = "assistant_for_chloe.main:replay"
test = "assistant_for_chloe.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
